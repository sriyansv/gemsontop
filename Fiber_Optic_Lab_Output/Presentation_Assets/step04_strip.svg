<rect x="30" y="195" width="400" height="30" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="430" y="203" width="330" height="14" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="30" y="208" width="730" height="4" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><path d="M380,110 L430,175 L455,175 L470,110 Z" fill="#9AA2AE" stroke="#2B2B2B" stroke-width="2"/><path d="M380,310 L430,245 L455,245 L470,310 Z" fill="#9AA2AE" stroke="#2B2B2B" stroke-width="2"/><line x1="520" y1="120" x2="720" y2="120" stroke="#C8642B" stroke-width="3"  marker-end="url(#arORANGE)" /><text x="620" y="105" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#C8642B" font-weight="400" text-anchor="middle" >pull straight</text><line x1="600" y1="217" x2="600" y2="270" stroke="#2B2B2B" stroke-width="1" /><text x="600" y="292" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#2B2B2B" font-weight="400" text-anchor="middle" >bare glass (125 µm)</text><line x1="200" y1="225" x2="200" y2="270" stroke="#2B2B2B" stroke-width="1" /><text x="200" y="292" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#2B2B2B" font-weight="400" text-anchor="middle" >coating (250 µm)</text><text x="30" y="380" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >Use the smallest notch of the stripper. Hold it square</text><text x="30" y="410" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >to the fiber and pull in one smooth stroke.</text><text x="30" y="440" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >Strip length: follow the cleaver/splicer guide (about 3–4 cm).</text>
</svg>