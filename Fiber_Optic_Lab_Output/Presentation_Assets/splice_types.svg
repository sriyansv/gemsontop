<text x="40" y="40" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >Fusion splice</text><rect x="40" y="162" width="276" height="16" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="40" y="167.5" width="276" height="5" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><rect x="324" y="162" width="276" height="16" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="324" y="167.5" width="276" height="5" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><path d="M320,70 L320,120" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/><path d="M320,220 L320,270" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/><path d="M320,125 L312,140 L326,152 L314,165 L328,178 L316,192 L324,215" stroke="#C8642B" stroke-width="4" fill="none"/><text x="340" y="95" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#7D838C" font-weight="400" text-anchor="start" >electrode</text><text x="340" y="285" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#7D838C" font-weight="400" text-anchor="start" >electrode</text><text x="40" y="315" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#2B2B2B" font-weight="400" text-anchor="start" >An electric arc melts the glass ends together.</text><text x="760" y="40" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >Mechanical splice</text><rect x="880" y="120" width="360" height="100" rx="10" fill="#E9E6DF" stroke="#2B2B2B" stroke-width="2" /><rect x="1015" y="150" width="90" height="40" rx="8" fill="#F7E0C8" stroke="#C8642B" stroke-width="1.5" /><rect x="760" y="162" width="298" height="16" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="760" y="167.5" width="298" height="5" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><rect x="1062" y="162" width="318" height="16" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="1062" y="167.5" width="318" height="5" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><line x1="1060" y1="150" x2="1060" y2="95" stroke="#C8642B" stroke-width="1.5" /><text x="1060" y="88" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#C8642B" font-weight="400" text-anchor="middle" >index-matching gel</text><text x="1060" y="250" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#7D838C" font-weight="400" text-anchor="middle" >housing holds the fibers in line</text><text x="760" y="315" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#2B2B2B" font-weight="400" text-anchor="start" >Fiber ends are pushed together and clamped.</text>
