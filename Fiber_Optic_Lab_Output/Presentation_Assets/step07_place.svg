<text x="30" y="40" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#7D838C" font-weight="400" text-anchor="start" font-style="italic">Top view inside the splicer</text><rect x="60" y="70" width="680" height="280" rx="12" fill="#E9E6DF" stroke="#2B2B2B" stroke-width="2" /><rect x="120" y="185" width="200" height="50" rx="4" fill="#B8BEC8" stroke="#2B2B2B" stroke-width="1.5" /><rect x="480" y="185" width="200" height="50" rx="4" fill="#B8BEC8" stroke="#2B2B2B" stroke-width="1.5" /><text x="220" y="265" font-family="Carlito, Calibri, Arial, sans-serif" font-size="19" fill="#2B2B2B" font-weight="400" text-anchor="middle" >V-groove + clamp</text><text x="580" y="265" font-family="Carlito, Calibri, Arial, sans-serif" font-size="19" fill="#2B2B2B" font-weight="400" text-anchor="middle" >V-groove + clamp</text><rect x="20" y="197" width="210" height="26" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="230" y="204" width="155" height="12" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="20" y="208" width="365" height="4" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><rect x="570" y="197" width="210" height="26" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="415" y="204" width="155" height="12" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="415" y="208" width="365" height="4" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><path d="M400,95 L400,165" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/><path d="M400,255 L400,325" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/><text x="415" y="120" font-family="Carlito, Calibri, Arial, sans-serif" font-size="19" fill="#7D838C" font-weight="400" text-anchor="start" >electrodes</text><text x="30" y="400" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >Lay each fiber in its V-groove with the tip just short of the</text><