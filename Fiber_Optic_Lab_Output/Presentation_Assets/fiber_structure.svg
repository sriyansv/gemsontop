<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<defs>
<marker id="arINK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2B2B"/></marker>
<marker id="arNAVY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3352"/></marker>
<marker id="arORANGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8642B"/></marker>
<marker id="arTEAL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D7A"/></marker>
<marker id="arGREY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D838C"/></marker>
<marker id="arWHITE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#C9C6BF" stroke-width="3"/></pattern>
</defs>

<circle cx="230" cy="300" r="190" fill="#A9B4C0" stroke="#6E7A88" stroke-width="2"/><circle cx="230" cy="300" r="120" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="2"/><circle cx="230" cy="300" r="26" fill="#F4C7A5" stroke="#C8642B" stroke-width="2"/><line x1="240" y1="290" x2="470" y2="130" stroke="#2B2B2B" stroke-width="1.5" /><circle cx="240" cy="290" r="4" fill="#2B2B2B" stroke="none" stroke-width="2"/><text x="478" y="136" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >Core</text><text x="478" y="164" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >≈ 8–9 µm (single-mode)</text><text x="478" y="189.2" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >light travels here</text><line x1="310" y1="360" x2="470" y2="300" stroke="#2B2B2B" stroke-width="1.5" /><circle cx="310" cy="360" r="4" fill="#2B2B2B" stroke="none" stroke-width="2"/><text x="478" y="306" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >Cladding</text><text x="478" y="334" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >125 µm glass, slightly</text><text x="478" y="359.2" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >lower refractive index</text><line x1="380" y1="400" x2="470" y2="470" stroke="#2B2B2B" stroke-width="1.5" /><circle cx="380" cy="400" r="4" fill="#2B2B2B" stroke="none" stroke-width="2"/><text x="478" y="476" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >Coating</text><text x="478" y="504" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >250 µm plastic layer,</text><text x="478" y="529.2" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7D838C" font-weight="400" text-anchor="start" >protects the glass</text><text x="230" y="580" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#7D838C" font-weight="400" text-anchor="middle" font-style="italic">Cross-section (not to scale)</text><rect x="830" y="195" width="630" height="210" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="2" /><rect x="830" y="225" width="630" height="150" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="2" /><rect x="830" y="277" width="630" height="46" rx="0" fill="#F4C7A5" stroke="#C8642B" stroke-width="1.5" /><polyline points="770,360 840,323 935,277 1030,323 1125,277 1220,323 1315,277 1410,323" fill="none" stroke="#C8642B" stroke-width="4" marker-end="url(#arORANGE)"/><text x="760" y="395" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#C8642B" font-weight="700" text-anchor="start" >light in</text><line x1="935" y1="277" x2="935" y2="167" stroke="#2B2B2B" stroke-width="1.5" /><text x="945" y="162" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#2B2B2B" font-weight="400" text-anchor="start" >Total internal reflection at the core–cladding boundary</text><text x="830" y="530" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >Core index n₁ is a little higher than cladding index n₂.</text><text x="830" y="562" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >Light hitting the boundary at a shallow angle bounces back</text><text x="830" y="594" font-family="Carlito, Calibri, Arial, sans-serif" font-size="23" fill="#2B2B2B" font-weight="400" text-anchor="start" >into the core, so it stays trapped and travels long distances.</text><text x="840" y="185" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#7D838C" font-weight="400" text-anchor="start" font-style="italic">Side view</text>
</svg>