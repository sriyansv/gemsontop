<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<defs>
<marker id="arINK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2B2B"/></marker>
<marker id="arNAVY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3352"/></marker>
<marker id="arORANGE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8642B"/></marker>
<marker id="arTEAL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D7A"/></marker>
<marker id="arGREY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D838C"/></marker>
<marker id="arWHITE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#C9C6BF" stroke-width="3"/></pattern>
</defs>

<rect x="30" y="90" width="520" height="400" rx="14" fill="#202B3C" stroke="#56637A" stroke-width="2" /><text x="50" y="75" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#9AA6B6" font-weight="400" text-anchor="start" font-style="italic">OTDR (inside view, simplified)</text><rect x="60" y="120" width="180" height="70" rx="8" fill="#2E3B50" stroke="#8FA1BC" stroke-width="1.5" /><text x="150" y="163" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#E8ECF2" font-weight="400" text-anchor="middle" >Pulse laser</text><rect x="320" y="230" width="180" height="80" rx="8" fill="#2E3B50" stroke="#8FA1BC" stroke-width="1.5" /><text x="410" y="278" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#E8ECF2" font-weight="400" text-anchor="middle" >Coupler</text><rect x="60" y="340" width="180" height="70" rx="8" fill="#2E3B50" stroke="#8FA1BC" stroke-width="1.5" /><text x="150" y="383" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#E8ECF2" font-weight="400" text-anchor="middle" >Photodetector</text><rect x="60" y="425" width="450" height="50" rx="8" fill="#33415A" stroke="#8FA1BC" stroke-width="1.5" /><text x="285" y="458" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#E8ECF2" font-weight="400" text-anchor="middle" >Timer + processor → graph</text><path d="M240,155 L410,155 L410,230" stroke="#C8642B" stroke-width="3" fill="none" marker-end="url(#arORANGE)"/><path d="M380,310 L380,375 L240,375" stroke="#7FD0D6" stroke-width="3" fill="none" marker-end="url(#arTEAL)"/><line x1="150" y1="410" x2="150" y2="425" stroke="#9AA6B6" stroke-width="2" /><rect x="550" y="255" width="30" height="30" rx="0" fill="#8FA1BC" stroke="none" stroke-width="2" /><text x="565" y="330" font-family="Carlito, Calibri, Arial, sans-serif" font-size="18" fill="#9AA6B6" font-weight="400" text-anchor="middle" >port</text><line x1="500" y1="270" x2="550" y2="270" stroke="#8FA1BC" stroke-width="3" /><line x1="580" y1="270" x2="1540" y2="270" stroke="#7FA5AB" stroke-width="10" /><circle cx="1100" cy="270" r="10" fill="#C9D2DC" stroke="none" stroke-width="2"/><text x="1100" y="245" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#9AA6B6" font-weight="400" text-anchor="middle" >connector / splice</text><rect x="1530" y="250" width="20" height="40" rx="0" fill="#C9D2DC" stroke="none" stroke-width="2" /><text x="1540" y="330" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#9AA6B6" font-weight="400" text-anchor="middle" >fiber end</text><rect x="800" y="230" width="70" height="18" rx="4" fill="#C8642B" stroke="none" stroke-width="2" /><line x1="880" y1="225" x2="1010" y2="225" stroke="#C8642B" stroke-width="3"  marker-end="url(#arORANGE)" /><text x="835" y="210" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#F2B48A" font-weight="700" text-anchor="middle" >① light pulse goes out</text><line x1="700" y1="300" x2="640" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><line x1="820" y1="300" x2="760" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><line x1="940" y1="300" x2="880" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><line x1="1060" y1="300" x2="1000" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><line x1="1180" y1="300" x2="1120" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><line x1="1300" y1="300" x2="1240" y2="300" stroke="#7FD0D6" stroke-width="2.5"  marker-end="url(#arTEAL)" /><text x="830" y="345" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7FD0D6" font-weight="400" text-anchor="start" >② Rayleigh backscattering: a tiny part of the light is</text><text x="830" y="372" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#7FD0D6" font-weight="400" text-anchor="start" >scattered back from every point along the fiber</text><path d="M1540,310 C1500,420 1300,420 1280,420" stroke="#F2B48A" stroke-width="3" fill="none" marker-end="url(#arORANGE)"/><text x="1100" y="455" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#F2B48A" font-weight="400" text-anchor="start" >③ Fresnel reflection: a strong echo where the glass</text><text x="1100" y="482" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#F2B48A" font-weight="400" text-anchor="start" >meets air or a gap (connector, break, open end)</text><text x="30" y="570" font-family="Carlito, Calibri, Arial, sans-serif" font-size="25" fill="#E8ECF2" font-weight="700" text-anchor="start" >④ Time of the echo → distance:</text><text x="400" y="570" font-family="Carlito, Calibri, Arial, sans-serif" font-size="30" fill="#F2B48A" font-weight="700" text-anchor="start" >d = (c × t) / (2 n)</text><text x="30" y="608" font-family="Carlito, Calibri, Arial, sans-serif" font-size="21" fill="#9AA6B6" font-weight="400" text-anchor="start" >c = speed of light in vacuum, t = round-trip time, n = group index of the fiber (≈ 1.47). Divide by 2 because light goes out and back.</text>
</svg>