<text x="40" y="60" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >BEFORE — two separate fibers</text><rect x="60" y="135" width="360" height="30" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="420" y="143" width="220" height="14" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="60" y="148" width="580" height="4" rx="0" fill="#C8642B" stroke="none" stroke-width="0" /><rect x="880" y="135" width="420" height="30" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="700" y="143" width="180" height="14" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="700" y="148" width="600" height="4" rx="0" fill="#F4C7A5" stroke="none" stroke-width="0" /><line x1="560" y1="110" x2="640" y2="140" stroke="#C8642B" stroke-width="2.5"  marker-end="url(#arORANGE)" /><path d="M640,150 L690,128 L690,172 Z" fill="#C8642B" opacity="0.3"/><text x="660" y="220" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#C8642B" font-weight="400" text-anchor="middle" >gap → light escapes,</text><text x="660" y="246" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#C8642B" font-weight="400" text-anchor="middle" >nothing reaches the other side</text><text x="40" y="340" font-family="Carlito, Calibri, Arial, sans-serif" font-size="26" fill="#1F3352" font-weight="700" text-anchor="start" >AFTER — one continuous path</text><rect x="60" y="415" width="360" height="30" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="880" y="415" width="420" height="30" rx="0" fill="#A9B4C0" stroke="#6E7A88" stroke-width="1.5" /><rect x="420" y="423" width="460" height="14" rx="0" fill="#D6E8EA" stroke="#7FA5AB" stroke-width="1.2" /><rect x="60" y="428" width="1240" height="4" rx="0" fill="#C8642B" stroke="none" stroke-width="0" /><ellipse cx="660" cy="430" rx="40" ry="12" fill="none" stroke="#2E7D7A" stroke-width="3" stroke-dasharray="6 4"/><line x1="660" y1="418" x2="660" y2="360" stroke="#2E7D7A" stroke-width="1.5" /><text x="670" y="360" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#2E7D7A" font-weight="400" text-anchor="start" >splice point (cores lined up and joined)</text><line x1="1150" y1="430" x2="1290" y2="430" stroke="#C8642B" stroke-width="3"  marker-end="url(#arORANGE)" /><text x="1300" y="480" font-family="Carlito, Calibri, Arial, sans-serif" font-size="22" fill="#C8642B" font-weight="400" text-anchor="end" >light continues</text><text x="60" y="530" font-family="Carlito, Calibri, Arial, sans-serif" font-size="20" fill="#7D838C" font-weight="400" text-anchor="start" font-style="italic">Bare glass is shown without coating near the joint, as during splicing.</text>
</svg>